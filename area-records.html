<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Records | Tylka Genealogical Log</title><link rel="stylesheet" href="styles.css?v=20261120-geneteka-area-search-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="script.js?v=20261120-header-add-record-1" defer></script><script src="site-ui.js?v=20261120-record-management-restore-2" defer></script><script src="area-records.js?v=20261120-area-alias-match-3" defer></script></head><body><a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><a class="wordmark" href="index.html"><img class="brand-seal" src="brand-seal.svg" alt=""><span class="wordmark-title"><strong>Tylka</strong><small>Genealogical Log</small></span></a><button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button><nav id="primary-nav" class="primary-nav"><a href="index.html">Coverage map</a><a href="ancestors.html">Ancestors</a><button class="owner-sign-in-button" type="button" data-owner-sign-in>Owner Sign In</button></nav></header><main id="main-content" class="coverage-home-main area-search-page">
<section class="coverage-panel area-search-panel">
<p class="eyebrow" id="area-country">Coverage area</p>
<h1 id="area-heading">Area records</h1>
<p id="area-summary">Browse indexed records from this area.</p>
<div class="area-search-controls" aria-label="Search records">
<label>Surname<input id="area-surname" type="search" autocomplete="off" placeholder="Enter surname"></label>
<label>Given name<input id="area-given" type="search" autocomplete="off" placeholder="Enter given name"></label>
<label>Year<input id="area-year" type="text" inputmode="numeric" maxlength="4" placeholder="e.g. 1890"></label>
</div>
<section class="area-results-section" aria-label="Regional record results">
<div class="area-folder-bar" role="group" aria-label="Filter results by record folder">
<button type="button" class="area-folder-button is-active" data-folder="all" aria-pressed="true">All records</button>
<button type="button" class="area-folder-button" data-folder="births" aria-pressed="false">Births</button>
<button type="button" class="area-folder-button" data-folder="deaths" aria-pressed="false">Deaths</button>
<button type="button" class="area-folder-button" data-folder="marriages" aria-pressed="false">Marriages</button>
<button type="button" class="area-folder-button" data-folder="immigration" aria-pressed="false">Immigration</button>
<button type="button" class="area-folder-button" data-folder="photos" aria-pressed="false">Photographs</button>
<button type="button" class="area-folder-button" data-folder="notes" aria-pressed="false">Sources</button>
</div>
<div id="area-results" aria-live="polite"><p>Loading records…</p></div>
</section>
</section></main><footer class="site-footer"><a class="wordmark footer-mark" href="index.html"><img class="brand-seal" src="brand-seal.svg" alt=""><span class="wordmark-title"><strong>Tylka</strong><small>Genealogical Log</small></span></a><p>A searchable collection of family evidence.</p></footer></body></html>
